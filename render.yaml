services:
  - type: web
    name: madden-stat-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Paste your Neon (or other) Postgres connection string in after the
      # first deploy — see README.md for how to get one for free.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: EXPORT_API_KEY
        generateValue: true
