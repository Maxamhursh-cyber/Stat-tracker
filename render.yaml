databases:
  - name: madden-stat-tracker-db
    plan: free
    ipAllowList: []

services:
  - type: web
    name: madden-stat-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: madden-stat-tracker-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: EXPORT_API_KEY
        generateValue: true
